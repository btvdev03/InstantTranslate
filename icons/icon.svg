<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#grad)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- "A" Letter -->
  <text x="40" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle">A</text>
  
  <!-- "文" Character -->
  <text x="88" y="94" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-weight="800" font-size="38" fill="#E0F2FE" text-anchor="middle">文</text>
  
  <!-- Connecting curved arrow / transfer line -->
  <path d="M 45 84 C 55 92, 65 92, 75 84" fill="none" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round"/>
  <polyline points="72,78 78,84 72,90" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
